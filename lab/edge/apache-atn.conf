# Alias under mesh.example.org HTTPS vhost (org-site / org-edge).
# Include from the TLS VirtualHost, or drop into conf-enabled.
Alias /atn/ /var/www/atn/
<Directory /var/www/atn>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>
