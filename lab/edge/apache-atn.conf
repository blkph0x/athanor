# Alias under the org HTTPS vhost that serves the edge panel.
# Include from the TLS VirtualHost, or drop into conf-enabled.
# DocumentRoot / path is operator-local; do not bake org domains here.
Alias /atn/ /var/www/atn/
<Directory /var/www/atn>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>
